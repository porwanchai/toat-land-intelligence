# ============================================================
# TOAT Land Intelligence System Blueprint Specification (render.yaml)
# ============================================================
services:
  # 1. FastAPI Web API Service
  - type: web
    name: toat-api
    env: docker
    plan: free # Can be upgraded to starter/standard for higher resources
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: toat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: toat-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: JWT_SECRET_KEY
        sync: false # Generate and set manually in Render Dashboard

  # 2. Celery Asynchronous Background Worker
  - type: worker
    name: toat-worker
    env: docker
    plan: free
    branch: main
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: toat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: toat-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 3. Redis Instance (Celery Message Broker)
  - type: redis
    name: toat-redis
    plan: free
    ipAllowList: [] # Private network access only

# 4. Managed PostgreSQL Database Instance with PostGIS
databases:
  - name: toat-postgres
    databaseName: toat_land_db
    user: toat
    plan: free
